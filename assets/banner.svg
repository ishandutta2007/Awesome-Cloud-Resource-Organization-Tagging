<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#title-grad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
      .pill { rx: 16px; ry: 16px; }
      
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      
      .animated-float-1 { animation: float1 6s ease-in-out infinite; }
      .animated-float-2 { animation: float2 7s ease-in-out infinite; }
      .animated-pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .animated-dash { stroke-dasharray: 8, 8; animation: dash 15s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Animated Glowing Orbs -->
  <circle cx="150" cy="100" r="180" fill="#3b82f6" filter="url(#glow)" class="animated-pulse" opacity="0.25"/>
  <circle cx="1050" cy="300" r="200" fill="#8b5cf6" filter="url(#glow)" class="animated-pulse" opacity="0.25"/>

  <!-- Background Dynamic Network Lines (Behind Text) -->
  <path d="M 100 320 Q 300 260 600 330 T 1100 280" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2" class="animated-dash"/>
  <path d="M 50 120 Q 400 180 800 100 T 1150 160" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" class="animated-dash"/>

  <!-- Background Cards & Floating Elements (Low Opacity, Positioned to not obscure text) -->
  <g class="animated-float-1" opacity="0.85">
    <!-- Top Right Floating Tag Card -->
    <rect x="860" y="50" width="260" height="70" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
    <rect x="880" y="70" width="85" height="30" class="pill" fill="#2563eb"/>
    <text x="922" y="90" class="badge-text" text-anchor="middle">Env: Prod</text>
    <rect x="975" y="70" width="125" height="30" class="pill" fill="#0d9488"/>
    <text x="1037" y="90" class="badge-text" text-anchor="middle">CostCenter: 104</text>
  </g>

  <g class="animated-float-2" opacity="0.85">
    <!-- Bottom Right Governance Pill Card -->
    <rect x="800" y="270" width="340" height="80" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
    <rect x="820" y="295" width="140" height="30" class="pill" fill="#7c3aed"/>
    <text x="890" y="315" class="badge-text" text-anchor="middle">CloudCustodian</text>
    <rect x="970" y="295" width="150" height="30" class="pill" fill="#db2777"/>
    <text x="1045" y="315" class="badge-text" text-anchor="middle">TagEnforcement: ✅</text>
  </g>

  <!-- Foreground Title and Subtitle Block (Clear & Unobscured) -->
  <g transform="translate(80, 150)">
    <!-- Icon & Title -->
    <g transform="translate(0, 0)">
      <!-- Cloud Tag Icon -->
      <path d="M 0 10 L 25 -15 L 55 -15 L 55 15 L 25 45 Z" fill="url(#title-grad)" transform="scale(0.8) translate(-10, -20)"/>
      <circle cx="32" cy="-4" r="3" fill="#0f172a"/>
      <text x="55" y="10" class="title">Awesome Cloud Resource Organization &amp; Tagging 🏷️ ☁️</text>
    </g>
    
    <!-- Subtitle -->
    <text x="0" y="55" class="subtitle">Curated Directory of Cloud Resource Governance, Tag Enforcement &amp; FinOps Automation</text>

    <!-- Category Badges / Tags -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="110" height="32" class="pill" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
      <text x="55" y="21" class="badge-text" fill="#38bdf8" text-anchor="middle">🏷️ Tagging</text>

      <rect x="125" y="0" width="100" height="32" class="pill" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1"/>
      <text x="175" y="21" class="badge-text" fill="#818cf8" text-anchor="middle">💰 FinOps</text>

      <rect x="240" y="0" width="130" height="32" class="pill" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1"/>
      <text x="305" y="21" class="badge-text" fill="#c084fc" text-anchor="middle">🛡️ Governance</text>

      <rect x="385" y="0" width="140" height="32" class="pill" fill="rgba(52, 211, 153, 0.15)" stroke="#34d399" stroke-width="1"/>
      <text x="455" y="21" class="badge-text" fill="#34d399" text-anchor="middle">⚡ Open-Source</text>
    </g>
  </g>
</svg>
